# K16: server :81 melayani /var/www/html (dibuat installer via mkdir -p).
# Baris ssl di bawah DIPAKAI bila sertifikat LE sudah ada; bila belum ada,
# installer menghapus baris ssl + mengubah listen menjadi HTTP polos :81
# supaya nginx -t lolos dan status menjadi "TLS pending" (bukan gagal total).
server {
    listen 81 ssl http2 reuseport;
    ssl_certificate /etc/xray/xray.crt;
    ssl_certificate_key /etc/xray/xray.key;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+ECDSA+AES128:EECDH+aRSA+AES128:RSA+AES128:EECDH+ECDSA+AES256:EECDH+aRSA+AES256:RSA+AES256:EECDH+ECDSA+3DES:EECDH+aRSA+3DES:RSA+3DES:!MD5;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/html;
    location / {
        try_files $uri $uri/ =404;
    }
    location /webhook/deposit {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 256k;
    }
}
    # F-B3: server gRPC saja (http2). Dirutekan tls-router :10019
    # bila aliran diawali preface HTTP/2 ("PRI "); bukan lewat haproxy.
