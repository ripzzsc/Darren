server {
    listen 1010 so_keepalive=on reuseport;
    set_real_ip_from 127.0.0.1;
    real_ip_header  proxy_protocol;
    server_name xxx;
    client_body_buffer_size 200K;
    client_header_buffer_size 2k;
    client_max_body_size 10M;
    large_client_header_buffers 3 1k;
    client_header_timeout 360s;
    keepalive_timeout 360s;
    add_header X-HTTP-LEVEL-HEADER 1;
    add_header X-ANOTHER-HTTP-LEVEL-HEADER 1;
    add_header X-XSS-Protection "1; mode=block";

    # F-B3 (regresi I-12): "listen 1010 http2" MEMATIKAN WS - nginx dengan
    # http2 cleartext hanya bicara HTTP/2 prior-knowledge; request WS
    # HTTP/1.1 dibalas frame HTTP/2 SETTINGS (handshake :443/:80 = 000).
    # Jadi :1010 kembali polos (HTTP/1.1, WS saja); gRPC pindah ke server
    # :1013 di bawah (sudah http2). tls-router :10019 merutekan preface
    # HTTP/2 ("PRI ") ke :1013, "SSH-" ke sshd :22, sisanya ke :1010.
    # Lokasi gRPC di server ini DIHAPUS - regex "~ /vless" juga cocok
    # dengan "/vless-grpc", jadi gRPC tidak boleh ada di :1010 lagi.
    location ~ /vless {
    if ($http_upgrade != "Websocket") {
    rewrite /(.*) /vless break;
    }
    add_header X-HTTP-LEVEL-HEADER 1;
    add_header X-ANOTHER-HTTP-LEVEL-HEADER 1;
    add_header X-SERVER-LEVEL-HEADER 1;
    add_header X-LOCATION-LEVEL-HEADER 1;
    proxy_headers_hash_max_size 512;
    proxy_headers_hash_bucket_size 128;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:10001;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_forwarded_for;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  }
    location ~ /vmess {
    if ($http_upgrade != "Websocket") {
    rewrite /(.*) /vmess break;
